<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>[연구용 시안] 중원도서관 무선인터넷 이용 및 피난 안내</title>
<style>
:root{--bg:#fff;--tx:#3d3d3d;--mu:#7a7a7a;--ln:#dcdcdc;--ft:#eeeeee;--ac:#0b6b4f;--act:#fff;--okb:#e8f4ee;--okl:#2e8b62;--bdb:#fbeaea;--bdl:#c0463f;--smb:#fff4d6;--smt:#6b4e00;--out:#d9dcdf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d1f;--tx:#e6e6e6;--mu:#9a9a9a;--ln:#3a3d40;--ft:#232628;--ac:#5fc79c;--act:#0f2a20;--okb:#1d3328;--okl:#4aa57e;--bdb:#3a2223;--bdl:#d36a63;--smb:#3b3216;--smt:#f0d789;--out:#0f1011}}
:root[data-theme="dark"]{--bg:#1b1d1f;--tx:#e6e6e6;--mu:#9a9a9a;--ln:#3a3d40;--ft:#232628;--ac:#5fc79c;--act:#0f2a20;--okb:#1d3328;--okl:#4aa57e;--bdb:#3a2223;--bdl:#d36a63;--smb:#3b3216;--smt:#f0d789;--out:#0f1011}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.55}
.phone{flex:1;display:flex;flex-direction:column;width:100%;background:var(--bg)}
main{flex:1;width:100%;max-width:480px;margin:0 auto;padding:28px 22px 24px}
.site{margin:0 0 4px;color:var(--mu);font-size:14px}
h1{margin:0 0 20px;font-size:28px;font-weight:300;line-height:1.3;letter-spacing:-.01em}
.sample{margin:0 0 18px;padding:9px 12px;border-radius:6px;background:var(--smb);color:var(--smt);font-size:13px}
.map{margin:0 0 20px}
.map a{display:block}
.map img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--ln);background:#fff}
.map figcaption{margin-top:6px;color:var(--mu);font-size:13px}
.q{margin:0 0 16px;font-size:19px;font-weight:500;line-height:1.5;word-break:keep-all}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border:1px solid var(--ln);border-radius:8px;background:transparent;color:var(--tx);font:inherit;font-size:16px;cursor:pointer;transition:background-color .15s,border-color .15s}
.opt .n{flex:none;width:24px;color:var(--mu)}
.opt:hover:not([disabled]){border-color:var(--ac)}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--okb);border-color:var(--okl);font-weight:500}
.opt.bad{background:var(--bdb);border-color:var(--bdl)}
.res{margin:18px 0 0;padding:14px;border-radius:8px;background:var(--okb);border:1px solid var(--okl)}
.res.bad{background:var(--bdb);border-color:var(--bdl)}
.res strong{display:block;margin-bottom:4px;font-size:16px}
.res p{margin:0;font-size:15px;word-break:keep-all}
.acts{margin-top:22px;text-align:center}
.go{width:100%;padding:15px;border:0;border-radius:8px;background:var(--ac);color:var(--act);font:inherit;font-size:17px;font-weight:500;cursor:pointer}
.skip{padding:10px 14px;border:0;background:none;color:var(--mu);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer}
.note{margin:12px 0 0;color:var(--mu);font-size:13px}
.home{display:inline-block;margin-top:14px;padding:8px 6px;color:var(--ac);font-size:15px;text-decoration:underline}
.opt:focus-visible,.go:focus-visible,.skip:focus-visible,.home:focus-visible,.map a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.opt,.go,.skip,.home{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
footer{padding:20px 22px 26px;background:var(--ft);color:var(--mu);font-size:12.5px;text-align:center}
footer p{max-width:480px;margin:0 auto}
@media (min-width:600px){body{background:var(--out);padding:28px 0}.phone{flex:none;align-self:center;width:390px;min-height:780px;border:1px solid var(--ln);border-radius:30px;overflow:hidden}}
@media (prefers-reduced-motion:reduce){.opt{transition:none}}
</style>
</head>
<body>
<div class="phone">
<main>
  <p class="site">중원도서관 무선인터넷</p>
  <h1>연결 전에<br>안전 퀴즈 1문제</h1>
  <p class="sample" id="sample" hidden>샘플 문항입니다. 정답표의 실제 값으로 바꾼 뒤 사용하세요.</p>
  <figure class="map" id="map" hidden>
    <a id="mapLink" href="#" target="_blank" rel="noopener"><img id="mapImg" alt="피난안내도"></a>
    <figcaption id="mapCap"></figcaption>
  </figure>
  <p class="q" id="q"></p>
  <ul class="opts" id="opts"></ul>
  <div class="res" id="res" role="status" aria-live="polite" hidden></div>
  <div class="acts">
    <button class="skip" id="skip" type="button">건너뛰기</button>
    <div id="links" hidden>
      <button class="go" id="go" type="button">와이파이 연결하기</button>
      <p class="note" id="note" hidden>시안 화면입니다. 실제 환경에서는 이 단계에서 인터넷에 연결됩니다.</p>
      <a class="home" href="https://www.konkuk.ac.kr" target="_blank" rel="noopener">건국대학교 홈페이지 바로가기</a>
    </div>
  </div>
</main>
<footer>
  <p>본 화면은 도시방재론 과제를 위한 연구용 시안이며 학교 공식 화면이 아닙니다. 선택한 답은 이 화면에 저장되지 않습니다.</p>
</footer>
</div>

var MAP_CAPTION = "1층 피난안내도 · 탭하면 크게 볼 수 있어요";

var QUESTIONS = [
  { /* 문제 1 */
    question: "앵커마루에서 가장 가까운 소화기는 어디에 있을까요?",
    options: ["앵커마루 출입문 옆", "자판기 뒤", "화장실 앞 복도", "엘리베이터 옆"],
    answer: 0,
    explanation: "가장 가까운 소화기는 앵커마루 출입문 옆에 있어요. 화재가 나면 이 위치를 기억해 주세요."
  },
  { /* 문제 2 */
    question: "110호 열람실에서 가장 가까운 소화기는 어디에 있을까요?",
    options: ["계단 아래 보관함", "카페 계산대 밑", "111호 출입구 옆", "야외 출입구 옆"],
    answer: 2,
    explanation: "가장 가까운 소화기는 111호 출입구 옆에 있어요. 화재가 나면 이 위치를 기억해 주세요."
  },
  { /* 문제 3 */
    question: "화장실과 가장 가까운 소화기는 어디에 있을까요?",
    options: ["야외 출입구 옆", "ATM기 옆", "엘리베이터 옆", "화장실 앞"],
    answer: 3,
    explanation: "가장 가까운 소화기는 화장실 앞에 있어요. 화재가 나면 이 위치를 기억해 주세요."
  },
  { /* 문제 4 */
    question: "건물에서 화재 경보가 울렸을 때 대피 방법으로 알맞은 것은?",
    options: ["짐을 다 챙긴 뒤 이동한다", "계단을 이용해 밖으로 대피한다", "엘리베이터로 빠르게 내려간다", "자리에서 안내 방송을 기다린다"],
    answer: 1,
    explanation: "화재 시 엘리베이터는 정전이나 연기 때문에 갇힐 수 있어요. 가까운 비상구와 계단으로 대피해 주세요."
  },
  { /* 문제 5 */
    question: "소화기를 사용할 때 가장 먼저 해야 할 일은?",
    options: ["손잡이를 세게 움켜쥔다", "소화기를 흔들어 본다", "불 위쪽 연기를 향해 뿌린다", "안전핀을 뽑는다"],
    answer: 3,
    explanation: "안전핀을 뽑고, 노즐을 불 쪽으로 향한 뒤, 손잡이를 움켜쥐고 빗자루로 쓸 듯이 불의 아랫부분에 뿌려요."
  }
];
var SHUFFLE_OPTIONS = true;  /* 보기 순서를 섞을지 */
var NEXT_URL = "";           /* "와이파이 연결하기"를 누르면 갈 주소. 비우면 시안 안내 문구가 나옵니다. */
/* ===================================================================== */

(function () {
  var marks = ["①", "②", "③", "④", "⑤", "⑥"];
  var param = parseInt(new URLSearchParams(location.search).get("q"), 10);
  var idx = (param >= 1 && param <= QUESTIONS.length) ? param - 1 : Math.floor(Math.random() * QUESTIONS.length);
  var Q = QUESTIONS[idx];
  var $ = function (id) { return document.getElementById(id); };

  if (Q.sample) $("sample").hidden = false;

  var mapFile = Q.map !== undefined ? Q.map : MAP_IMAGE;
  if (mapFile) {
    $("mapImg").onerror = function () { $("map").hidden = true; };
    $("mapImg").src = mapFile;
    $("mapLink").href = mapFile;
    if (mapFile.indexOf("data:") === 0) {   /* 파일 안에 넣은 도면도 "크게 보기"가 열리도록 */
      fetch(mapFile).then(function (r) { return r.blob(); }).then(function (b) {
        $("mapLink").href = URL.createObjectURL(b);
      }).catch(function () {});
    }
    $("mapCap").textContent = Q.mapCaption !== undefined ? Q.mapCaption : MAP_CAPTION;
    $("map").hidden = false;
  }

  $("q").textContent = Q.question;

  var order = Q.options.map(function (t, i) { return { t: t, i: i }; });
  if (SHUFFLE_OPTIONS) {
    for (var k = order.length - 1; k > 0; k--) {
      var j = Math.floor(Math.random() * (k + 1)), tmp = order[k]; order[k] = order[j]; order[j] = tmp;
    }
  }
  var buttons = order.map(function (o, pos) {
    var li = document.createElement("li"), b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    var n = document.createElement("span"); n.className = "n"; n.textContent = marks[pos];
    var s = document.createElement("span"); s.textContent = o.t;
    b.appendChild(n); b.appendChild(s); li.appendChild(b); $("opts").appendChild(li);
    b.addEventListener("click", function () { pick(o.i, b); });
    return { el: b, idx: o.i };
  });

  function showLinks() { $("skip").hidden = true; $("links").hidden = false; }

  function pick(choice, chosen) {
    var right = choice === Q.answer;
    buttons.forEach(function (x) {
      x.el.disabled = true;
      if (x.idx === Q.answer) x.el.classList.add("ok");
    });
    if (!right) chosen.classList.add("bad");

    var res = $("res");
    res.className = "res" + (right ? "" : " bad");
    res.textContent = "";
    var st = document.createElement("strong");
    st.textContent = right ? "정답입니다" : "아쉬워요, 정답은 표시된 곳이에요";
    var p = document.createElement("p"); p.textContent = Q.explanation;
    res.appendChild(st); res.appendChild(p);
    res.hidden = false;
    showLinks();
    $("go").focus();
  }

  $("go").addEventListener("click", function () {
    if (NEXT_URL) { location.href = NEXT_URL; } else { $("note").hidden = false; }
  });
  $("skip").addEventListener("click", function () { showLinks(); $("go").focus(); });
})();
</script>
